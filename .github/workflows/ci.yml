name: CI
on:
  push: { branches: [main, wave-0-foundation, feature/guest-invite] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        # node-version-file, not a literal: .nvmrc is now the single source of truth for
        # the Node version, so a developer's local runtime and CI's cannot drift. Task 1 hit
        # that drift - vitest's config loader needs require(ESM), which Node 20.18 lacks and
        # CI's Node 22 has, so a broken config would have been green here and unloadable
        # locally.
        with: { node-version-file: '.nvmrc', cache: npm }

      - run: npm ci
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
