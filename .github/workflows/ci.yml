name: CI
on:
  push: { branches: [main, wave-0-foundation, feature/guest-invite] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        # node-version-file, not a literal: .nvmrc is now the single source of truth for
        # the Node version, so a developer's local runtime and CI's cannot drift. Task 1 hit
        # that drift - vitest's config loader needs require(ESM), which Node 20.18 lacks and
        # CI's Node 22 has, so a broken config would have been green here and unloadable
        # locally.
        with: { node-version-file: '.nvmrc', cache: npm }

      - run: npm ci
      - run: npm run verify
      - run: npx playwright install --with-deps chromium

      # The live suite (e2e/live/**) needs tandem-api with Postgres 17, Redis 7 and Mailpit,
      # which needs tandem-api checked out into this job - a cross-repo checkout token or a
      # published API image, neither of which exists yet. It is a LOCAL acceptance gate with a
      # committed runbook (docs/local-e2e-runbook.md) until one does. A CI job gated on a
      # possibly-absent secret would skip silently, which is the failure mode this project has
      # already shipped three times. Tracked as a spec §16 prerequisite in the Wave 1b plan.
      #
      # `npm run e2e` is `--project=fixture`, which `testIgnore: /live\//` scopes to the specs
      # that need no API. `npm run e2e:live` is the all-projects command the runbook drives.
      - run: npm run e2e
